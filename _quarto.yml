project:
  type: website
  output-dir: _site
  pre-render: python scripts/sort_sidebar.py

website:
  title: "My Professional Blog"
  site-url: "https://muztahid-2020331021.github.io/Machine-Learning-Blog/"
  description: "Thoughts on code, data, and the craft of writing."
  favicon: assets/images/favicon.ico
  open-graph: true
  twitter-card: true

  navbar:
    logo: assets/images/logo.png
    left:
      - text: "Home"
        href: index.qmd
      - text: "Articles"
        href: articles/index.qmd
      - text: "About"
        href: about.qmd
    right:
      - icon: github
        href: https://github.com/Muztahid-2020331021
      - icon: linkedin
        href: https://www.linkedin.com/in/muztahid-hassan-sajid/
      - icon: globe
        href: https://www.sajid.me

  sidebar:
    style: "docked"
    contents:
      - text: "TOPICS"
      - section: "Articles"
        contents: "articles/*/**/index.qmd"
        section-style: "flat"

  page-footer:
    left: "© 2026 Md Muztahid Hassan. All rights reserved."
    center:
      - icon: github
        href: https://github.com/Muztahid-2020331021
      - icon: globe
        href: https://www.sajid.me
      - icon: linkedin
        href: https://www.linkedin.com/in/muztahid-hassan-sajid/
    right: "Built with [Quarto](https://quarto.org)"

  search: true
  back-to-top-navigation: true

  google-analytics: "G-HRWVF9ZMF1"

format:
  html:
    theme:
      light: [flatly, styles/main.scss]
      dark:  [darkly, styles/main.scss]
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    include-after-body:
      - text: |
          <script>
          window.addEventListener('scroll', function() {
            const btn = document.getElementById('quarto-back-to-top');
            if (!btn) return;

            const scrollPos = window.scrollY;
            const totalHeight = document.documentElement.scrollHeight;
            const viewportHeight = window.innerHeight;
            const bottomThreshold = 15;

            if (scrollPos <= 0 || (scrollPos + viewportHeight >= totalHeight - bottomThreshold)) {
              btn.style.setProperty('display', 'none', 'important');
            } else if (scrollPos > 100) {
              btn.style.setProperty('display', 'block', 'important');
            }
          });

          document.addEventListener('DOMContentLoaded', function() {
            const currentUrl = window.location.href.toLowerCase();
            const navLinks = document.querySelectorAll('.navbar-nav .nav-link');
            
            if (currentUrl.includes('/articles/') || currentUrl.includes('\\articles\\') || currentUrl.endsWith('articles/')) {
              navLinks.forEach(link => {
                if (link.innerText.trim() === 'Articles') {
                  link.classList.add('active');
                } else if (link.innerText.trim() === 'Home' || link.innerText.trim() === 'About') {
                  link.classList.remove('active');
                }
              });
            }
          });
          </script>

execute:
  freeze: auto
  echo: true
  warning: false
